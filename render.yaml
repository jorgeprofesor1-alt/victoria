# ==========================================
# Render Blueprint Specification (Infrastructure as Code)
# Victoria Performance Nutrition
# ==========================================

services:
  # ------------------------------------------------------
  # 1. API Backend (NestJS + Prisma + Docker)
  # ------------------------------------------------------
  - type: web
    name: victoria-backend-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    region: oregon
    disk:
      name: victoria-uploads
      mountPath: /app/uploads
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: victoria-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://tienda-victoria-pasto.netlify.app,https://victoria-frontend-web.onrender.com"
      - key: UPLOAD_DIR
        value: uploads
      - key: RUN_SEED
        value: "true"
      - key: INITIAL_ADMIN_EMAIL
        value: "jorge.profesor@hotmail.com"
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true

  # ------------------------------------------------------
  # 2. Frontend Web (Vite + React SPA Static Site)
  # ------------------------------------------------------
  - type: web
    name: victoria-frontend-web
    runtime: static
    rootDir: ./EccormceDeportivo
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_STORE_WHATSAPP_NUMBER
        value: "573224197485"
      - key: VITE_API_URL
        value: "https://victoria-backend-api.onrender.com/api/v1"
      - key: VITE_UPLOADS_URL
        value: "https://victoria-backend-api.onrender.com"

databases:
  # ------------------------------------------------------
  # 3. Base de Datos PostgreSQL Administrada
  # ------------------------------------------------------
  - name: victoria-db
    databaseName: victoria_db
    user: victoria_user
    plan: free
    region: oregon
